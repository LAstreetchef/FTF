services:
  - type: web
    name: food-truck-fundraiser
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: STRIPE_TEST_MODE
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: RESTORE_EVENT_BACKUP
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: food-truck-fundraiser-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_COMBO_PRICE_ID
        sync: false
      - key: CAMPAIGN_SWEEP_TOKEN
        sync: false
      - key: GREEN_TRUCK_MINIMUM
        value: "1750"
      - key: COMBO_PRICE
        value: "18"
      - key: CAMPAIGN_DAYS
        value: "7"
      - key: CAMPAIGN_FEE_RATE
        value: "0.045"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: food-truck-fundraiser-db
    plan: basic-256mb
    databaseName: foodtruckfundraiser
    user: foodtruck
