{% extends "base.html" %}

{% block title %}Admin Login - Food Truck Fundraiser{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">
                    <i data-feather="shield" class="me-2"></i>
                    Admin Login
                </h4>
            </div>
            <div class="card-body">
                <form method="POST" id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="email" class="form-control" id="username" name="username" required value="truckstopsla@gmail.com">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required value="password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i data-feather="log-in" class="me-2"></i>
                        Login
                    </button>
                </form>
                
                <script>
                // Enhanced iframe support for form submission
                document.getElementById('loginForm').addEventListener('submit', function(e) {
                    // Check if in iframe and log for debugging
                    const inIframe = window.self !== window.top;
                    console.log('Form submitted, in iframe:', inIframe);
                    console.log('Current URL:', window.location.href);
                    console.log('Referrer:', document.referrer);
                    console.log('Parent URL:', inIframe ? window.parent.location.href : 'Not in iframe');
                    
                    // Add iframe indicator to form if needed
                    if (inIframe) {
                        const iframeField = document.createElement('input');
                        iframeField.type = 'hidden';
                        iframeField.name = 'iframe_context';
                        iframeField.value = 'true';
                        this.appendChild(iframeField);
                    }
                });
                
                // Also log iframe status on page load
                window.addEventListener('load', function() {
                    const inIframe = window.self !== window.top;
                    console.log('Admin login page loaded, in iframe:', inIframe);
                    if (inIframe) {
                        console.log('Parent domain:', document.referrer);
                    }
                });
                </script>
                
                <hr>
                <div class="text-center">
                    <small class="text-muted">
                        Admin access only. Contact system administrator for credentials.
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
